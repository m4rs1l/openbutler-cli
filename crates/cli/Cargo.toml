[package]
name = "openbutler-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
openbutler-protocol = { git = "https://github.com/m4rs1l/openbutler-protocol", rev = "c6bb9d447f5411bb32af4e030131c5ea2b94cd3f", version = "0.0.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
uuid = { version = "1.29.3", features = ["v4"] }
