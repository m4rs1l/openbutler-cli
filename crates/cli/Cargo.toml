[package]
name = "openbutler-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The installed command is `openbutler`; the package keeps the repo name.
[[bin]]
name = "openbutler"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
openbutler-protocol = { git = "https://github.com/m4rs1l/openbutler-protocol", rev = "d78d378", version = "0.0.1" }
ratatui = "0.30.2"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
uuid = { version = "1.29.3", features = ["v4"] }
futures-util = "0.3"
tokio-tungstenite = "0.29"
